<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>SECOND LOOK — film cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --lime: #D3EA2C; --ink: #040D16; --text: #F2F5F7; --text-2: #9AA4AE; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--ink); color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    animation: drift 7s linear both;
  }
  body.clear { background: transparent; animation: none; display: block; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.03); } }
  body:not(.clear)::before {
    content: ''; position: fixed; inset: -20%;
    background: radial-gradient(55% 50% at 20% 40%, rgba(211,234,44,0.09), transparent 60%),
                radial-gradient(48% 44% at 82% 72%, rgba(60,120,180,0.09), transparent 62%);
    filter: blur(34px);
  }

  /* ---------- statement cards ---------- */
  .stmt { padding: 0 170px; width: 100%; }
  .stmt.center { text-align: center; }
  .kicker {
    font-size: 19px; font-weight: 700; letter-spacing: 0.38em; text-transform: uppercase;
    color: var(--lime); margin-bottom: 40px;
    opacity: 0; animation: rise .9s cubic-bezier(.16,1,.3,1) .15s both;
  }
  h1 { font-weight: 900; letter-spacing: -0.04em; line-height: 0.94; }
  h1.big { font-size: 175px; text-transform: uppercase; letter-spacing: -0.045em; }
  h1.mid { font-size: 128px; }
  h1 .ln { display: block; overflow: hidden; }
  h1 .ln > span { display: block; transform: translateY(106%); animation: lift 1.05s cubic-bezier(.16,1,.3,1) both; }
  h1 .ln:nth-child(1) > span { animation-delay: .26s; }
  h1 .ln:nth-child(2) > span { animation-delay: .38s; }
  h1 .ln:nth-child(3) > span { animation-delay: .50s; }
  h1 em { font-style: normal; color: var(--lime); }
  .rule { height: 4px; width: 240px; background: var(--lime); margin: 46px 0 34px;
    transform: scaleX(0); transform-origin: left; animation: swipe .9s cubic-bezier(.16,1,.3,1) .8s both; }
  .stmt.center .rule { margin-left: auto; margin-right: auto; transform-origin: center; }
  p.sub { font-size: 33px; font-weight: 500; color: var(--text-2); line-height: 1.45; max-width: 1180px;
    opacity: 0; animation: rise 1s cubic-bezier(.16,1,.3,1) 1s both; }
  .stmt.center p.sub { margin: 0 auto; }
  @keyframes lift { to { transform: translateY(0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes swipe { to { transform: scaleX(1); } }

  /* ---------- brand cards ---------- */
  .mark { text-align: center; width: 100%; }
  .wm { font-size: 158px; font-weight: 900; letter-spacing: 0.015em; line-height: 0.9; display: inline-block; }
  .wm span { display: block; overflow: hidden; }
  .wm span > i { font-style: normal; display: block; transform: translateY(106%); animation: lift 1.1s cubic-bezier(.16,1,.3,1) both; }
  .wm span:nth-child(1) > i { animation-delay: .2s; }
  .wm span:nth-child(2) > i { animation-delay: .33s; }
  .swoosh { display: inline-block; width: 96px; height: 31px; margin-left: 20px; vertical-align: 13px;
    clip-path: polygon(6% 22%, 100% 22%, 78% 82%, 0% 82%); background: var(--lime);
    transform: scaleX(0); transform-origin: left; animation: swipe .8s cubic-bezier(.16,1,.3,1) .78s both; }
  .mark p { font-size: 40px; font-weight: 500; color: var(--text-2); margin-top: 42px;
    opacity: 0; animation: rise 1s cubic-bezier(.16,1,.3,1) 1s both; }
  .mark p b { color: var(--text); font-weight: 700; }
  .url { display: inline-block; margin-top: 52px; font-size: 30px; font-weight: 700;
    color: var(--ink); background: var(--lime); padding: 21px 46px; border-radius: 999px;
    opacity: 0; animation: rise .9s cubic-bezier(.16,1,.3,1) 1.35s both; }

  /* ---------- stats ---------- */
  .stats { display: flex; gap: 108px; justify-content: center; width: 100%; }
  .stat { text-align: center; opacity: 0; animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
  .stat:nth-child(1) { animation-delay: .25s; } .stat:nth-child(2) { animation-delay: .42s; }
  .stat:nth-child(3) { animation-delay: .59s; } .stat:nth-child(4) { animation-delay: .76s; }
  .stat b { display: block; font-size: 112px; font-weight: 900; letter-spacing: -0.035em; color: var(--lime); }
  .stat span { display: block; margin-top: 14px; font-size: 21px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-2); }

  /* ---------- lower thirds (transparent, composited over UI footage) ---------- */
  .lower { position: absolute; left: 96px; bottom: 108px; }
  .lower .bar { width: 5px; background: var(--lime); position: absolute; left: -22px; top: 4px; bottom: 4px;
    transform: scaleY(0); transform-origin: top; animation: growY .55s cubic-bezier(.16,1,.3,1) .1s both; }
  @keyframes growY { to { transform: scaleY(1); } }
  .lower .k { font-size: 17px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--lime);
    opacity: 0; animation: rise .6s cubic-bezier(.16,1,.3,1) .22s both; }
  .lower .v { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; margin-top: 10px;
    text-shadow: 0 4px 30px rgba(0,0,0,.8); opacity: 0; animation: rise .7s cubic-bezier(.16,1,.3,1) .34s both; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const CARDS = {
  /* cold open */
  hook: `<div class="stmt">
      <p class="kicker">Secondhand sports gear</p>
      <h1 class="big"><span class="ln"><span>You found</span></span><span class="ln"><span>the jacket.</span></span></h1>
      <div class="rule"></div>
      <p class="sub">You still have no idea how it looks on you.</p>
    </div>`,
  open: `<div class="mark">
      <div class="wm"><span><i>SECOND</i></span><span><i>LOOK<em class="swoosh"></em></i></span></div>
      <p>Give gear <b>a second game.</b></p>
    </div>`,
  real: `<div class="stmt">
      <p class="kicker">Every listing is real</p>
      <h1 class="mid"><span class="ln"><span>Not a mockup.</span></span><span class="ln"><span>A <em>real</em> marketplace.</span></span></h1>
      <div class="rule"></div>
      <p class="sub">Live gear from Poshmark, SidelineSwap and GearTrade — real prices, real sellers, real links.</p>
    </div>`,
  tryon: `<div class="stmt">
      <p class="kicker">The part nobody else has</p>
      <h1 class="big"><span class="ln"><span>See it</span></span><span class="ln"><span>on <em>you.</em></span></span></h1>
      <div class="rule"></div>
      <p class="sub">AI puts the exact listing on a real model — free, no uploads, no account.</p>
    </div>`,
  six: `<div class="stmt center">
      <h1 class="mid"><span class="ln"><span>One jacket.</span></span><span class="ln"><span><em>Six</em> athletes.</span></span></h1>
      <div class="rule"></div>
      <p class="sub">Pick the body closest to yours. The fit comes with it.</p>
    </div>`,
  search: `<div class="stmt">
      <p class="kicker">Any item · any athlete</p>
      <h1 class="big"><span class="ln"><span>Search</span></span><span class="ln"><span>anything.</span></span><span class="ln"><span><em>Wear</em> it.</span></span></h1>
    </div>`,
  stats: `<div class="stats">
      <div class="stat"><b data-count="1289">0</b><span>Real listings</span></div>
      <div class="stat"><b data-count="3">0</b><span>Live shops</span></div>
      <div class="stat"><b data-count="6">0</b><span>Athletes</span></div>
      <div class="stat"><b>$0</b><span>To try it on</span></div>
    </div>`,
  end: `<div class="mark">
      <div class="wm"><span><i>SECOND</i></span><span><i>LOOK<em class="swoosh"></em></i></span></div>
      <p>Give gear <b>a second game.</b></p>
      <span class="url">2.24.223.99:3488</span>
    </div>`,
};
const LOWERS = {
  live: ['Live right now', '1,289 real listings · 3 shops'],
  seller: ['Straight from the seller', 'Real price · real photos · real link'],
  ai: ['On-device cutout, then AI', 'The look lands in about 30 seconds'],
  free: ['What it costs', 'Free — no uploads, no account'],
  phone: ['Works on the phone', 'Same gear, same AI'],
};
const q = new URLSearchParams(location.search);
const lower = q.get('lower');
if (lower && LOWERS[lower]) {
  document.body.classList.add('clear');
  const [k, v] = LOWERS[lower];
  document.getElementById('root').innerHTML =
    `<div class="lower"><span class="bar"></span><p class="k">${k}</p><p class="v">${v}</p></div>`;
} else {
  document.getElementById('root').innerHTML = CARDS[q.get('card') || 'open'] || CARDS.open;
}
document.querySelectorAll('[data-count]').forEach((el) => {
  const target = Number(el.dataset.count), t0 = performance.now() + 300, dur = 1500;
  (function tick(now) {
    const t = Math.max(0, Math.min(1, (now - t0) / dur));
    el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3))).toLocaleString();
    if (t < 1) requestAnimationFrame(tick);
  })(performance.now());
});
</script>
</body>
</html>
