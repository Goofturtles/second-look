name: refresh-live
# Re-fetches real listings from the shops and commits data/live.json,
# so the GitHub Pages site always shows recent real listings with real stats.
on:
  schedule:
    - cron: '17 */6 * * *' # four times a day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-live.js
      - name: commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/live.json
          git diff --cached --quiet || git commit -m 'refresh live listings data'
          git push
